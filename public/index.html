<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dandiya Fest 2026 - Student Entry Pass Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0e1a;
      --card-bg: rgba(26, 31, 56, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      --gold-glow: rgba(245, 158, 11, 0.35);
      --festive-pink: #ec4899;
      --purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top center, #2e1065 0%, #0f172a 50%, #030712 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Festive Glows */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 320px;
      height: 320px;
      background: rgba(236, 72, 153, 0.22);
      top: 5%;
      left: 15%;
    }

    body::after {
      width: 360px;
      height: 360px;
      background: rgba(245, 158, 11, 0.18);
      bottom: 5%;
      right: 15%;
    }

    .main-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(236, 72, 153, 0.25));
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--gold-bright);
      border-radius: 9999px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #fcd34d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      text-align: center;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 16px;
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 16px var(--gold-glow);
      background: rgba(15, 23, 42, 0.95);
    }

    button.btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(236, 72, 153, 0.5);
    }

    button.btn-primary:active {
      transform: translateY(0);
    }

    /* Pass Result Card */
    #result {
      margin-top: 24px;
    }

    .pass-ticket {
      background: radial-gradient(circle at top, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 18px;
      padding: 24px 20px;
      position: relative;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 20px var(--gold-glow);
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .pass-banner {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin-bottom: 6px;
    }

    .student-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .student-meta {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .meta-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .qr-frame {
      display: inline-block;
      background: white;
      padding: 12px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      margin-bottom: 16px;
    }

    .qr-frame img {
      width: 200px;
      height: 200px;
      display: block;
    }

    .pass-instruction {
      font-size: 12px;
      color: #34d399;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      animation: popIn 0.3s ease;
    }

    .footer-link {
      margin-top: 20px;
      text-align: center;
    }

    .footer-link a {
      color: var(--text-muted);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-link a:hover {
      color: var(--gold-bright);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="header">
      <div class="top-badge">✨ Dandiya Fest 2026</div>
      <h1>Official Entry Pass</h1>
      <p class="subtitle">Enter your assigned UTU roll number to generate your QR pass</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="rollInput">Student Roll Number</label>
        <input type="text" id="rollInput" placeholder="e.g. UTU-D26-31" autocomplete="off" spellcheck="false" autofocus>
      </div>

      <button id="submitBtn" class="btn-primary" onclick="getPass()">
        <span>Get My QR Pass</span>
        <span>🎟️</span>
      </button>

      <div id="result"></div>
    </div>

    <div class="footer-link">
      <a href="/scanner.html">Go to Gate Security Scanner 📷 &rarr;</a>
    </div>
  </div>

  <script>
    async function getPass() {
      const rollInput = document.getElementById('rollInput');
      const submitBtn = document.getElementById('submitBtn');
      const rollNumber = rollInput.value.trim();
      const resultDiv = document.getElementById('result');

      if (!rollNumber) {
        rollInput.focus();
        showPassError(resultDiv, 'Please enter your UTU roll number.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> Generating Pass...`;
      resultDiv.replaceChildren();

      try {
        const response = await fetch('/api/get-pass', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rollNumber })
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
          showPassError(resultDiv, data.error || 'Unable to generate your pass. Please try again.');
          return;
        }

        if (typeof data.name !== 'string' ||
            typeof data.branch !== 'string' ||
            typeof data.rollNumber !== 'string' ||
            typeof data.qrImage !== 'string' ||
            !data.qrImage.startsWith('data:image/')) {
          throw new Error('The server returned an invalid pass.');
        }

        const ticket = document.createElement('div');
        ticket.className = 'pass-ticket';

        const banner = document.createElement('div');
        banner.className = 'pass-banner';
        banner.textContent = 'ADMIT ONE • FESTIVAL PASS';

        const name = document.createElement('h3');
        name.className = 'student-name';
        name.textContent = data.name;

        const meta = document.createElement('div');
        meta.className = 'student-meta';
        [data.rollNumber, data.branch].forEach(value => {
          const badge = document.createElement('span');
          badge.className = 'meta-badge';
          badge.textContent = value;
          meta.appendChild(badge);
        });

        const qrFrame = document.createElement('div');
        qrFrame.className = 'qr-frame';
        const qrImage = document.createElement('img');
        qrImage.src = data.qrImage;
        qrImage.alt = `QR Pass for ${data.name}`;
        qrFrame.appendChild(qrImage);

        const instruction = document.createElement('p');
        instruction.className = 'pass-instruction';
        instruction.textContent = '📸 Keep a screenshot ready at the gate!';

        ticket.append(banner, name, meta, qrFrame, instruction);
        resultDiv.replaceChildren(ticket);
      } catch (err) {
        console.error('Pass request failed:', err);
        showPassError(resultDiv, 'Could not generate your pass. Please check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Get My QR Pass</span> <span>🎟️</span>`;
      }
    }

    function showPassError(container, message) {
      const error = document.createElement('div');
      error.className = 'error-box';
      error.textContent = message;
      container.replaceChildren(error);
    }

    // Allow Enter key to submit
    document.getElementById('rollInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') getPass();
    });
  </script>
</body>
</html>
